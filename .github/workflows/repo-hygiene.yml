name: Repository Hygiene

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  check-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run repository checks
        shell: pwsh
        run: ./scripts/check-repo.ps1
